name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Existing Cloudflare Pages project name (overrides the repository variable)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Resolve Cloudflare project settings
        id: config
        env:
          INPUT_PROJECT: ${{ inputs.project_name }}
          REPOSITORY_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          project="${INPUT_PROJECT:-${REPOSITORY_PROJECT:-}}"
          if [[ ! "$project" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo 'Provide a valid Pages project name using project_name or CLOUDFLARE_PAGES_PROJECT.' >&2
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Add the CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets.' >&2
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build static website
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.CLOUDFLARE_SITE_ORIGIN }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy out --project-name=${{ steps.config.outputs.project }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
